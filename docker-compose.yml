services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: autoeda-backend:latest
    container_name: autoeda-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # One heavy analysis at a time — two concurrent ones plus the API process
      # were OOM-killing the container (see dmesg "Memory cgroup out of memory").
      EDA_POOL_WORKERS: "1"
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/app/storage
    mem_limit: 3g
    memswap_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_storage: