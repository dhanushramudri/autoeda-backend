services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: autoeda-backend:latest
    container_name: autoeda-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/app/storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_storage: