services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: autoeda-backend:latest
    container_name: autoeda-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/app/storage

volumes:
  backend_storage:
